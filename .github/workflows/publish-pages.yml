name: Publish AI Daily Hub

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tasks.html'
      - 'manifest.json'
      - 'channels/**'
      - 'reports/**'
      - 'scripts/reconcile_archive.py'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
  schedule:
    # 11:17 Asia/Shanghai (03:17 UTC); recheck indexes daily.
    - cron: '17 3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-hub-pages
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconcile unindexed complete HTML files
        run: |
          python3 scripts/reconcile_archive.py --write
          python3 scripts/reconcile_archive.py
      - name: Commit index changes if needed
        run: |
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Reconcile published report index"
            git push
          fi
      - name: Prepare public site artifact
        run: |
          mkdir -p _site
          cp index.html tasks.html manifest.json _site/
          cp -R channels reports _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
